---
###########################################################
# Docker stack: unifi OS server
###########################################################

- name: Ensure Docker Compose plugin is installed
  ansible.builtin.apt:
    name: docker-compose-plugin
    state: present
    update_cache: true

###########################################################
# Deploy unifi OS server files
###########################################################

- name: Create unifi stack directory
  ansible.builtin.file:
    path: "{{ unifi_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Create unifi OS server compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ unifi_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

###########################################################
# Create persistent directories for unifi OS server
###########################################################

- name: Create Unifi OS Server directories
  ansible.builtin.file:
    path: "{{ unifi_dir }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - persistent
    - var-log
    - data
    - srv
    - var-lib-unifi
    - var-lib-mongodb
    - etc-rabbitmq-ssl

###########################################################
# Bring up Docker Compose stack
###########################################################

- name: Start unifi stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ unifi_dir }}"
  register: unifi_up
  changed_when: "'Creating' in unifi_up.stdout or 'Started' in unifi_up.stdout or unifi_up.rc == 0"