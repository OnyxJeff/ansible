---
- name: Install kiosk packages
  ansible.builtin.apt:
    name:
      - chromium
      - x11-xserver-utils
      - xdotool
      - unclutter
    state: present

- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ base_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - config
    - scripts