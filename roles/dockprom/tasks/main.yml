---
###########################################################
# Docker stack: dockprom
###########################################################

- name: Ensure Docker Compose plugin is installed
  ansible.builtin.apt:
    name: docker-compose-plugin
    state: present
    update_cache: true

###########################################################
# Deploy dockprom stack files
###########################################################

- name: Ensure dockprom directory exists
  ansible.builtin.file:
    path: "{{ dockprom_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy dockprom stack to host
  ansible.builtin.synchronize:
    src: dockprom/
    dest: "{{ dockprom_dir }}/"
    recursive: true

- name: Copy docker-compose.yml file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dockprom_dir }}/docker-compose.yml"
    mode: "0644"

###########################################################
# Copy prometheus.yml file
###########################################################

- name: Copy prometheus.yml file
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ dockprom_dir }}/prometheus/prometheus.yml"
    mode: "0644"

###########################################################
# Copy grafana.ini file
###########################################################

- name: Copy grafana.ini file
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ dockprom_dir }}/grafana/grafana.ini"
    mode: "0644"
  when: enable_monitoring_stack | default(false)

###########################################################
# Copy config.monitoring file
###########################################################

- name: Copy config.monitoring file
  ansible.builtin.template:
    src: config.monitoring.j2
    dest: "{{ dockprom_dir }}/grafana/config.monitoring"
    mode: "0644"
  when: enable_monitoring_stack | default(false)
  
###########################################################
# Bring up Docker Compose stack
###########################################################

- name: Start dockprom stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ dockprom_dir }}"
  register: dockprom_up
  changed_when: "'Creating' in dockprom_up.stdout or 'Recreating' in dockprom_up.stdout or 'Started' in dockprom_up.stdout"