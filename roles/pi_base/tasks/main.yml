---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - htop
      - ca-certificates
      - vim
      - nano
      - rsync
    state: present

- name: Ensure base tools directory exists
  ansible.builtin.file:
    path: /opt
    state: directory
    mode: '0755'

- name: Ensure scripts, logs, and backup_logs directories exist
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - scripts
    - logs
    - backup_logs
    
- name: Copy apt-get-autoupdater.sh script to the scripts directory
  ansible.builtin.template:
    src: apt-get-autoupdater.sh.j2
    dest: "/home/{{ ansible_user }}/scripts/apt-get-autoupdater.sh"
    mode: '0755'

- name: Configure OS auto-updater cron jobs
  become: true
  ansible.builtin.cron:
    name: "{{ item.name }}"
    minute: "{{ item.minute }}"
    hour: "{{ item.hour }}"
    day: "{{ item.day | default('*') }}"
    month: "{{ item.month | default('*') }}"
    weekday: "{{ item.weekday | default('*') }}"
    user: "{{ ansible_user }}"
    job: "{{ item.job }}"
  loop:
    - name: "OS-Auto-Updater - weekly update"
      minute: "0"
      hour: "1"
      weekday: "0"
      job: >
        bash /home/{{ ansible_user }}/scripts/apt-get-autoupdater.sh

    - name: "OS-Auto-Updater - monthly log backup"
      minute: "50"
      hour: "0"
      day: "1"
      job: >
        /bin/bash -c 'cp -p
        /home/{{ ansible_user }}/logs/apt-get-autoupdater.log
        /home/{{ ansible_user }}/backup_logs/apt-get-autoupdater-$(date +\%Y\%m\%d).log'

    - name: "OS-Auto-Updater - clear monthly log"
      minute: "51"
      hour: "0"
      day: "1"
      job: >
        rm -f /home/{{ ansible_user }}/logs/apt-get-autoupdater.log